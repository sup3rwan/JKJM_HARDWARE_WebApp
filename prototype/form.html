<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add a Product – JKJM Hardware</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="list.html">
        <span class="brand-logo" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6a4 4 0 0 0 5 5l-9 9a2 2 0 0 1-3-3l9-9z"/></svg></span>
        <span><span class="brand-name">JKJM Hardware</span><span class="brand-tag">Construction supplies &amp; hardware materials</span></span>
      </a>
      <nav class="main-nav" aria-label="Main">
        <a href="#"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h6"/></svg>Orders</a>
        <a href="list.html" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Products &amp; Stock</a>
        <a href="#"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
        <a href="#"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></svg><span class="nav-label-logout">Log out</span></a>
      </nav>
    </div>
  </header>
  <main class="container">
    <form class="form-card" action="list.html" method="post" enctype="multipart/form-data">
      <h1>Add a Product</h1>

      <div class="form-grid">
        <div class="field">
          <label for="name">Name *</label>
          <input class="input" type="text" id="name" name="name" placeholder="Product name" maxlength="100" required>
        </div>

        <div class="field">
          <label for="category">Category *</label>
          <select class="select" id="category" name="category" required>
            <option value="" disabled selected>Choose a category</option>
            <option value="Tools">Tools</option>
            <option value="Building Materials">Building Materials</option>
            <option value="Plumbing &amp; Electrical">Plumbing &amp; Electrical</option>
            <option value="Paint &amp; Finishing">Paint &amp; Finishing</option>
            <option value="Hardware &amp; Security">Hardware &amp; Security</option>
          </select>
        </div>

        <div class="field field-full">
          <label for="description">Description *</label>
          <input class="input" type="text" id="description" name="description" placeholder="Short description" maxlength="255" required>
        </div>

        <div class="field">
          <label for="unit_price">Unit Price (&#8369;) *</label>
          <input class="input" type="number" id="unit_price" name="unit_price" min="0" step="0.01" value="0" required>
        </div>

        <div class="field">
          <label for="stock">Stock *</label>
          <input class="input" type="number" id="stock" name="stock" min="0" step="1" value="0" required>
        </div>

        <div class="field">
          <label for="status">Status *</label>
          <select class="select" id="status" name="status" required>
            <option value="Available" selected>Available</option>
            <option value="Out of Stock">Out of Stock</option>
          </select>
        </div>

        <div class="field">
          <label for="image">Add Picture *</label>
          <input class="file" type="file" id="image" name="image" accept="image/*" required>
        </div>
      </div>

      <div class="form-actions">
        <a class="btn" href="list.html">Cancel</a>
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </main>
</body>
</html>
